# yaml-language-server: $schema=https://www.schemastore.org/fly.json
app = "priya-voice-agent"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/plivo/status"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
