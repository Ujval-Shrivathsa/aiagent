# Render Blueprint (repo root). App lives in saas-platform/.
services:
  - type: web
    name: priya-voice-agent
    runtime: node
    plan: free
    region: singapore
    rootDir: saas-platform
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/plivo/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: VOICE_PROVIDER
        value: plivo
      - key: APP_URL
        sync: false
      - key: VOICE_SERVER_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
