# Render Blueprint (repo root). App lives in saas-platform/.
services:
  - type: web
    name: priya-voice-agent
    runtime: node
    plan: free
    region: singapore
    rootDir: saas-platform
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, but Tailwind/PostCSS and TypeScript are needed to build.
    buildCommand: export NODE_OPTIONS=--max-old-space-size=4096 && npm ci --include=dev && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/plivo/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: VOICE_PROVIDER
        value: plivo
      - key: VOICE_TTS_VOICE_NAME
        value: Kore
      - key: VOICE_TTS_LANGUAGE_CODE
        value: kn-IN
      - key: VOICE_AAD_SILENCE_MS
        value: "250"
      - key: VOICE_VAD_SILENCE_MS
        value: "250"
      - key: VOICE_AAD_PREFIX_PADDING_MS
        value: "120"
      - key: VOICE_AAD_END_SENSITIVITY
        value: END_SENSITIVITY_HIGH
      - key: VOICE_INPUT_GAIN
        value: "3.1"
      - key: VOICE_VAD_ENERGY_MIN_RMS
        value: "85"
      - key: VOICE_GATE_OPEN_MIN_RMS
        value: "85"
      - key: VOICE_BARGE_IN_MIN_RMS
        value: "1700"
      - key: VOICE_BARGE_IN_MIN_MS
        value: "150"
      - key: VOICE_BARGE_IN_FLOOR_MULT
        value: "3.5"
      - key: VOICE_SPEECH_SCORE_MIN
        value: "1.0"
      - key: VOICE_SPEECH_AMBIGUOUS_MIN
        value: "0.55"
        # Classification vetoes: low-band rumble + flat-spectrum noise are
        # never speech, whatever their crest factor.
      - key: VOICE_SPEECH_MAX_LOW_RATIO
        value: "0.82"
      - key: VOICE_SPEECH_MAX_FLATNESS
        value: "0.78"
      - key: VOICE_SPEECH_SILENT_FLOOR_MULT
        value: "1.1"
      - key: VOICE_SPEECH_GATE_START_MS
        value: "60"
      - key: VOICE_SPEECH_GATE_WINDOW_MS
        value: "90"
      - key: VOICE_SPEECH_GATE_TOLERANCE_MS
        value: "140"
        # Floor adaptation: speech NEVER raises the floor (scream-trap fix);
        # sustained fan/AC noise converges into it fast; transients don't.
      - key: VOICE_FLOOR_STEADY_RATE
        value: "0.06"
      - key: VOICE_FLOOR_TRANSIENT_RATE
        value: "0.008"
      - key: VOICE_FLOOR_SPEECH_RATE
        value: "0.0008"
      - key: VOICE_FLOOR_QUIET_PULL_MULT
        value: "1.9"
      - key: VOICE_FLOOR_QUIET_PULL_RATE
        value: "0.07"
      - key: VOICE_RESPONSE_WATCHDOG_MS
        value: "700"
      - key: APP_URL
        sync: false
      - key: VOICE_SERVER_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: PLIVO_TRANSFER_NUMBER
        sync: false
